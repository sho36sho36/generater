<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <span class="logo-icon">✦</span>
        <span>Image Generator</span>
    </div>

    <button id="themeButton" class="theme-button" title="テーマ変更">
        ◐
    </button>
</header>

<main class="container">

    <section class="control-panel">

        <div class="section-title">
            <h1>画像を生成</h1>
            <p>テキストからオリジナル画像を作成します</p>
        </div>

        <label for="prompt">プロンプト</label>

        <textarea
            id="prompt"
            placeholder="例：夕焼けの海、青い空、幻想的な風景"
            rows="4"
        ></textarea>

        <div class="quick-prompts">
            <button data-prompt="宇宙、星空、幻想的">宇宙</button>
            <button data-prompt="夕焼けの海、幻想的な風景">夕焼け</button>
            <button data-prompt="深い森、緑、光">森</button>
            <button data-prompt="未来都市、ネオン、夜">未来都市</button>
            <button data-prompt="青い海、南国、明るい空">海</button>
            <button data-prompt="抽象的、カラフル、芸術的">抽象画</button>
        </div>

        <div class="settings">

            <div class="setting">
                <label for="size">サイズ</label>

                <select id="size">
                    <option value="256">256 × 256</option>
                    <option value="512" selected>512 × 512</option>
                    <option value="768">768 × 768</option>
                    <option value="1024">1024 × 1024</option>
                </select>
            </div>

            <div class="setting">
                <label for="seed">Seed</label>

                <div class="seed-row">
                    <input
                        id="seed"
                        type="number"
                        value="12345"
                    >

                    <button id="randomSeed" title="ランダムSeed">
                        🎲
                    </button>
                </div>
            </div>

            <div class="setting">
                <label for="quality">品質</label>

                <select id="quality">
                    <option value="low">軽量</option>
                    <option value="medium" selected>標準</option>
                    <option value="high">高品質</option>
                </select>
            </div>

        </div>

        <button id="generateButton" class="generate-button">
            <span>✦</span>
            画像を生成
        </button>

        <div id="status" class="status">
            準備完了
        </div>

    </section>


    <section class="result-panel">

        <div class="result-header">
            <div>
                <h2>生成結果</h2>
                <p id="resultInfo">まだ画像がありません</p>
            </div>

            <div class="result-actions">
                <button id="regenerateButton" disabled>
                    ↻ 再生成
                </button>

                <button id="downloadButton" disabled>
                    ↓ PNG保存
                </button>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas"></canvas>

            <div id="emptyState" class="empty-state">
                <div class="empty-icon">✦</div>
                <h3>画像を生成してください</h3>
                <p>プロンプトを入力して「画像を生成」を押してください</p>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>画像を生成しています…</p>
            </div>
        </div>

    </section>


    <section class="history-section">

        <div class="history-header">
            <div>
                <h2>生成履歴</h2>
                <p>このブラウザ内に保存されます</p>
            </div>

            <button id="clearHistory">
                履歴を削除
            </button>
        </div>

        <div id="history" class="history">
            <div class="history-empty">
                生成履歴はありません
            </div>
        </div>

    </section>

</main>

<footer>
    <p>Image Generator v1.0.0 · Browser Only</p>
</footer>

<script src="generator.js"></script>
<script src="app.js"></script>

</body>
</html>
